<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quiz Battle - Kelas VI</title>
<style>
    :root {
        --primary: #6c5ce7; --secondary: #fdcb6e; --success: #00b894; 
        --danger: #d63031; --dark: #2d3436; --light: #f5f6fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    .container { width: 95%; max-width: 1000px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); position: relative; }
    
    h1 { text-align: center; font-size: 2.5rem; background: linear-gradient(90deg, var(--secondary), #e17055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    .subtitle { text-align: center; color: #dfe6e9; margin-bottom: 20px; font-size: 1.1rem; }
    
    .screen { display: none; animation: fadeIn 0.5s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
    .card h3 { color: var(--secondary); margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
    
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #b2bec3; }
    input, select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: none; background: rgba(255,255,255,0.9); color: var(--dark); font-size: 1rem; font-weight: bold; }
    
    .btn { padding: 15px 30px; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; display: block; width: 100%; margin-top: 10px; }
    .btn-primary { background: linear-gradient(45deg, #fdcb6e, #e17055); color: white; box-shadow: 0 5px 15px rgba(225, 112, 85, 0.4); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(225, 112, 85, 0.6); }
    .btn-opt { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: white; margin-bottom: 10px; text-align: left; font-size: 1.1rem; }
    .btn-opt:hover { background: var(--primary); border-color: var(--primary); }
    .btn-opt.correct { background: var(--success); border-color: var(--success); animation: pulse 0.5s; }
    .btn-opt.wrong { background: var(--danger); border-color: var(--danger); animation: shake 0.5s; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; }
    .round-info { font-size: 1.5rem; color: var(--secondary); font-weight: bold; }
    .timer-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; margin: 15px 0; overflow: hidden; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--secondary), var(--danger)); width: 100%; transition: width 1s linear; }
    
    .question-box { background: white; color: var(--dark); padding: 30px; border-radius: 15px; font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 20px; min-height: 100px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
    
    .scoreboard { display: flex; justify-content: space-around; margin-top: 20px; }
    .team-score { text-align: center; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; flex: 1; margin: 0 10px; border: 2px solid transparent; transition: all 0.3s; }
    .team-score.active-turn { border-color: var(--secondary); box-shadow: 0 0 20px rgba(253, 203, 110, 0.5); }
    .team-score h4 { color: #dfe6e9; margin-bottom: 5px; }
    .team-score .pts { font-size: 2rem; color: var(--secondary); font-weight: bold; }
    
    .explanation { background: rgba(0, 184, 148, 0.2); border-left: 5px solid var(--success); padding: 15px; margin-top: 15px; border-radius: 5px; display: none; animation: fadeIn 0.5s; }
    .explanation h4 { color: var(--success); margin-bottom: 5px; }
    
    .leaderboard { text-align: center; }
    .trophy { font-size: 5rem; margin: 20px 0; animation: pulse 2s infinite; }
    .winner-name { font-size: 3rem; color: var(--secondary); margin-bottom: 20px; }
    .final-scores { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .final-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; min-width: 150px; }
    
    .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>

<div class="container">
    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="screen active">
        <h1>⚔️ Math Quiz Battle ⚔️</h1>
        <p class="subtitle">Kuis Matematika Interaktif Kelas VI - Bermain dalam Tim</p>
        
        <div class="setup-grid">
            <div class="card">
                <h3>👥 Daftar Kelompok</h3>
                <label>Kelompok 1 (2 Siswa)</label>
                <input type="text" id="team1" placeholder="Nama Kelompok 1" value="Tim Alpha">
                <label>Kelompok 2 (2 Siswa)</label>
                <input type="text" id="team2" placeholder="Nama Kelompok 2" value="Tim Beta">
                <label>Kelompok 3 (Opsional)</label>
                <input type="text" id="team3" placeholder="Kosongkan jika tidak ada">
                <label>Kelompok 4 (Opsional)</label>
                <input type="text" id="team4" placeholder="Kosongkan jika tidak ada">
            </div>
            <div class="card">
                <h3>⚙️ Pengaturan Guru</h3>
                <label>Tingkat Kesulitan</label>
                <select id="difficulty">
                    <option value="easy">Mudah (Waktu 20 detik)</option>
                    <option value="medium" selected>Sedang (Waktu 15 detik)</option>
                    <option value="hard">Sulit (Waktu 10 detik)</option>
                </select>
                <label>Jumlah Soal per Babak</label>
                <select id="numQuestions">
                    <option value="2">2 Soal (Cepat)</option>
                    <option value="3" selected>3 Soal (Normal)</option>
                    <option value="5">5 Soal (Panjang)</option>
                </select>
                <p style="font-size: 0.9rem; color: #b2bec3; margin-top:10px;">*Bonus kecepatan 50 poin jika menjawab < 5 detik.</p>
            </div>
        </div>
        <button class="btn btn-primary" onclick="startGame()">🚀 Mulai Battle!</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <div class="round-info" id="roundInfo">Babak 1: Pemanasan</div>
            <div style="text-align: right;">
                <div id="questionCount">Soal 1 / 3</div>
                <div id="timerText" style="font-size: 1.5rem; color: var(--secondary);">15</div>
            </div>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
        
        <div class="question-box" id="questionBox">Memuat soal...</div>
        <div id="optionsContainer"></div>
        
        <div class="explanation" id="explanationBox">
            <h4>💡 Pembahasan:</h4>
            <p id="explanationText"></p>
        </div>

        <div class="scoreboard" id="scoreboard"></div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="resultScreen" class="screen leaderboard">
        <div class="trophy">🏆</div>
        <h1>Pemenang Battle!</h1>
        <div class="winner-name" id="winnerName">-</div>
        <div class="final-scores" id="finalScores"></div>
        <button class="btn btn-primary" style="margin-top: 30px;" onclick="location.reload()">🔄 Main Lagi</button>
    </div>
</div>

<canvas id="confettiCanvas" class="confetti"></canvas>

<script>
    // --- QUESTION BANK (Accurate Grade VI Math) ---
    const questionBank = {
        round1: [ // Pemanasan (Pilihan Ganda - Operasi Hitung)
            { q: "Hasil dari 456 + 289 adalah...", opts: ["735", "745", "755", "645"], ans: 1, exp: "Susun ke bawah: 6+9=15 (simpan 5), 5+8+1=14 (simpan 4), 4+2+1=7. Hasilnya 745." },
            { q: "Ibu memiliki 802 butir telur. Pecah 347 butir. Sisa telur ibu adalah...", opts: ["455", "545", "465", "555"], ans: 0, exp: "802 - 347: 12-7=5, 9-4=5, 7-3=4. Hasilnya 455." },
            { q: "Hasil dari 24 × 15 adalah...", opts: ["340", "350", "360", "380"], ans: 2, exp: "24 × 15 = 24 × (10 + 5) = 240 + 120 = 360." },
            { q: "Hasil dari 144 : 12 adalah...", opts: ["11", "12", "13", "14"], ans: 1, exp: "144 dibagi 12. Ingat perkalian 12 × 12 = 144." },
            { q: "Bapak memanen 523 kg padi dan 298 kg jagung. Total panen adalah...", opts: ["821 kg", "811 kg", "831 kg", "721 kg"], ans: 0, exp: "523 + 298 = 821 kg." },
            { q: "25 × 11 sama dengan...", opts: ["255", "275", "265", "285"], ans: 1, exp: "25 × 11 = 25 × (10 + 1) = 250 + 25 = 275." }
        ],
        round2: [ // Duel Cepat (Benar/Salah - Faktor Prima & Pecahan)
            { q: "BENAR atau SALAH: Faktor prima dari 30 adalah 2, 3, dan 5.", opts: ["BENAR", "SALAH"], ans: 0, exp: "30 = 2 × 15 = 2 × 3 × 5. Semua adalah bilangan prima." },
            { q: "BENAR atau SALAH: Hasil dari 1/2 + 1/3 adalah 2/5.", opts: ["BENAR", "SALAH"], ans: 1, exp: "SALAH. Samakan penyebut (KPK 6): 3/6 + 2/6 = 5/6, bukan 2/5." },
            { q: "BENAR atau SALAH: Hasil dari 2/3 × 3/4 adalah 1/2.", opts: ["BENAR", "SALAH"], ans: 0, exp: "BENAR. (2×3)/(3×4) = 6/12. Disederhanakan menjadi 1/2." },
            { q: "BENAR atau SALAH: Faktor prima dari 24 adalah 2 dan 3.", opts: ["BENAR", "SALAH"], ans: 0, exp: "BENAR. 24 = 2³ × 3. Faktor primanya hanya 2 dan 3." },
            { q: "BENAR atau SALAH: 3/4 + 1/4 = 1.", opts: ["BENAR", "SALAH"], ans: 0, exp: "BENAR. Penyebut sudah sama. 3+1 = 4. 4/4 = 1." },
            { q: "BENAR atau SALAH: 45 dibagi 9 hasilnya 6.", opts: ["BENAR", "SALAH"], ans: 1, exp: "SALAH. 45 : 9 = 5." }
        ],
        round3: [ // Tantangan Final (Analisis Data & Soal Cerita)
            { q: "Data penjualan buah: Apel 45 kg, Jeruk 30 kg, Mangga 25 kg. Berapa selisih penjualan Apel dan Mangga?", opts: ["15 kg", "20 kg", "25 kg", "70 kg"], ans: 1, exp: "Selisih = Nilai terbesar - Nilai terkecil = 45 - 25 = 20 kg." },
            { q: "Dari data soal sebelumnya, berapa TOTAL semua buah yang terjual?", opts: ["90 kg", "95 kg", "100 kg", "105 kg"], ans: 2, exp: "Total = 45 + 30 + 25 = 100 kg." },
            { q: "Ibu membeli 1/2 kg gula, kemudian dipakai 1/4 kg. Sisa gula ibu adalah...", opts: ["1/4 kg", "2/4 kg", "1/3 kg", "3/4 kg"], ans: 0, exp: "1/2 - 1/4 = 2/4 - 1/4 = 1/4 kg." },
            { q: "FPB dari 12 dan 18 adalah...", opts: ["2", "3", "6", "36"], ans: 2, exp: "12 = 2² × 3. 18 = 2 × 3². FPB = 2 × 3 = 6." },
            { q: "Tabel nilai ulangan: 80 (5 siswa), 90 (3 siswa), 100 (2 siswa). Berapa jumlah siswa?", opts: ["8", "9", "10", "11"], ans: 2, exp: "Total siswa = 5 + 3 + 2 = 10 siswa." },
            { q: "KPK dari 4 dan 6 adalah...", opts: ["10", "12", "24", "2"], ans: 1, exp: "4 = 2². 6 = 2 × 3. KPK = 2² × 3 = 12." }
        ]
    };

    let state = {
        teams: [], scores: [], currentRound: 0, currentQ: 0, 
        timeLimit: 15, timer: null, timeLeft: 15, qPool: [], isAnswered: false
    };

    function startGame() {
        state.teams = [document.getElementById('team1').value || 'Tim 1', document.getElementById('team2').value || 'Tim 2'];
        if(document.getElementById('team3').value) state.teams.push(document.getElementById('team3').value);
        if(document.getElementById('team4').value) state.teams.push(document.getElementById('team4').value);
        
        state.scores = new Array(state.teams.length).fill(0);
        const diff = document.getElementById('difficulty').value;
        state.timeLimit = diff === 'easy' ? 20 : diff === 'medium' ? 15 : 10;
        
        const numQ = parseInt(document.getElementById('numQuestions').value);
        state.qPool = {
            r1: shuffle([...questionBank.round1]).slice(0, numQ),
            r2: shuffle([...questionBank.round2]).slice(0, numQ),
            r3: shuffle([...questionBank.round3]).slice(0, numQ)
        };

        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
        renderScoreboard();
        nextRound();
    }

    function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

    function nextRound() {
        state.currentQ = 0;
        if(state.currentRound === 0) document.getElementById('roundInfo').innerText = "Babak 1: Pemanasan";
        else if(state.currentRound === 1) document.getElementById('roundInfo').innerText = "Babak 2: Duel Cepat";
        else document.getElementById('roundInfo').innerText = "Babak 3: Tantangan Final";
        
        loadQuestion();
    }

    function loadQuestion() {
        state.isAnswered = false;
        document.getElementById('explanationBox').style.display = 'none';
        let pool = state.currentRound === 0 ? state.qPool.r1 : state.currentRound === 1 ? state.qPool.r2 : state.qPool.r3;
        
        if(state.currentQ >= pool.length) {
            state.currentRound++;
            if(state.currentRound > 2) return showResults();
            return nextRound();
        }

        const qData = pool[state.currentQ];
        document.getElementById('questionCount').innerText = `Soal ${state.currentQ + 1} / ${pool.length}`;
        document.getElementById('questionBox').innerText = qData.q;
        
        const optCont = document.getElementById('optionsContainer');
        optCont.innerHTML = '';
        qData.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-opt';
            btn.innerText = `${String.fromCharCode(65+idx)}. ${opt}`;
            btn.onclick = () => checkAnswer(idx, qData.ans, qData.exp, btn);
            optCont.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        state.timeLeft = state.timeLimit;
        document.getElementById('timerText').innerText = state.timeLeft;
        document.getElementById('timerFill').style.width = '100%';
        clearInterval(state.timer);
        state.timer = setInterval(() => {
            state.timeLeft--;
            document.getElementById('timerText').innerText = state.timeLeft;
            document.getElementById('timerFill').style.width = `${(state.timeLeft / state.timeLimit) * 100}%`;
            if(state.timeLeft <= 0) {
                clearInterval(state.timer);
                if(!state.isAnswered) timeOut();
            }
        }, 1000);
    }

    function checkAnswer(selected, correct, exp, btn) {
        if(state.isAnswered) return;
        state.isAnswered = true;
        clearInterval(state.timer);
        
        const buttons = document.querySelectorAll('.btn-opt');
        buttons[correct].classList.add('correct');
        
        let points = 0;
        if(selected === correct) {
            points = 100;
            if((state.timeLimit - state.timeLeft) <= 5) points += 50; // Speed Bonus
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
        }

        // Award points to a random team for demonstration (or turn-based)
        // Here we simulate a "Current Turn" logic by highlighting teams
        const activeTeam = document.querySelector('.team-score.active-turn');
        const teamIndex = Array.from(document.querySelectorAll('.team-score')).indexOf(activeTeam);
        if(selected === correct && teamIndex !== -1) {
            state.scores[teamIndex] += points;
            updateScores();
        }
        
        // Rotate turn
        rotateTurn();

        document.getElementById('explanationText').innerText = exp;
        document.getElementById('explanationBox').style.display = 'block';

        setTimeout(() => {
            state.currentQ++;
            loadQuestion();
        }, 4000);
    }

    function timeOut() {
        state.isAnswered = true;
        const buttons = document.querySelectorAll('.btn-opt');
        const qData = (state.currentRound === 0 ? state.qPool.r1 : state.currentRound === 1 ? state.qPool.r2 : state.qPool.r3)[state.currentQ];
        buttons[qData.ans].classList.add('correct');
        document.getElementById('explanationText').innerText = "Waktu habis! " + qData.exp;
        document.getElementById('explanationBox').style.display = 'block';
        rotateTurn();
        setTimeout(() => { state.currentQ++; loadQuestion(); }, 4000);
    }

    function rotateTurn() {
        const teams = document.querySelectorAll('.team-score');
        let active = document.querySelector('.team-score.active-turn');
        let idx = active ? Array.from(teams).indexOf(active) : -1;
        if(active) active.classList.remove('active-turn');
        idx = (idx + 1) % teams.length;
        teams[idx].classList.add('active-turn');
    }

    function renderScoreboard() {
        const sb = document.getElementById('scoreboard');
        sb.innerHTML = '';
        state.teams.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'team-score' + (i === 0 ? ' active-turn' : '');
            div.innerHTML = `<h4>${t}</h4><div class="pts" id="score-${i}">0</div>`;
            sb.appendChild(div);
        });
    }

    function updateScores() {
        state.scores.forEach((s, i) => {
            document.getElementById(`score-${i}`).innerText = s;
        });
    }

    function showResults() {
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        
        const maxScore = Math.max(...state.scores);
        const winnerIdx = state.scores.indexOf(maxScore);
        document.getElementById('winnerName').innerText = state.teams[winnerIdx];
        
        const fs = document.getElementById('finalScores');
        fs.innerHTML = '';
        state.teams.forEach((t, i) => {
            fs.innerHTML += `<div class="final-card"><h4>${t}</h4><div style="font-size:2rem; color:var(--secondary);">${state.scores[i]}</div></div>`;
        });
        
        launchConfetti();
    }

    // --- CONFETTI ANIMATION ---
    function launchConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        const colors = ['#fdcb6e', '#e17055', '#00b894', '#6c5ce7', '#ffffff'];
        
        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5, h: Math.random() * 5 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 3 + 2, angle: Math.random() * Math.PI * 2
            });
        }
        
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();
                p.y += p.speed; p.angle += 0.05;
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(draw);
        }
        draw();
    }
</script>
</body>
</html>
